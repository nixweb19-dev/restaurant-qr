<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Y├Ânetim Paneli | LSEMD</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/admin.css">
</head>
<body class="admin-body">
    <!-- Audio element for order notification sound -->
    <audio id="notificationSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <audio id="waiterSound" src="https://assets.mixkit.co/active_storage/sfx/1003/1003-preview.mp3" preload="auto"></audio>

    <!-- Garson ├ça─şr─▒lar─▒ Paneli -->
    <div id="waiterCallsContainer" style="position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px;">
        <button onclick="document.getElementById('waiterSound').play()" style="padding: 5px; background: var(--surface); border: 1px solid var(--border); cursor: pointer; border-radius: 5px;">­şöö Sesi Test Et</button>
        <!-- ├ça─şr─▒lar buraya d├╝┼şecek -->
    </div>

    <div class="admin-layout">
        <aside class="sidebar">
            <div class="brand">
                <h2>LSEMD Admin</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="active" id="tab-orders"><i class="fa-solid fa-bell-concierge"></i> Sipari┼şler</a>
                <a href="#" id="tab-tables"><i class="fa-solid fa-chair"></i> Masa Kontrol├╝</a>
                <a href="#" id="tab-history"><i class="fa-solid fa-clock-rotate-left"></i> Sipari┼ş Ge├ğmi┼şi</a>
                <a href="/"><i class="fa-solid fa-store"></i> Men├╝y├╝ G├Âr├╝nt├╝le</a>
            </nav>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <div class="header-title">
                    <h1 id="page-title">Canl─▒ Sipari┼ş Takibi</h1>
                    <div class="status-indicator">
                        <span class="pulse-dot"></span> Veritaban─▒na Ba─şl─▒
                    </div>
                </div>
            </header>

            <div class="orders-board" id="view-orders">
                <!-- Bekleyen Sipari┼şler -->
                <div class="order-column">
                    <div class="column-header warning">
                        <h3><i class="fa-solid fa-clock"></i> Bekleyenler</h3>
                        <span class="count" id="pendingCount">0</span>
                    </div>
                    <div class="column-content" id="pendingOrders">
                        <!-- Bekleyen sipari┼ş kartlar─▒ buraya -->
                    </div>
                </div>

                <!-- Haz─▒rlanan Sipari┼şler -->
                <div class="order-column">
                    <div class="column-header info">
                        <h3><i class="fa-solid fa-fire-burner"></i> Haz─▒rlan─▒yor</h3>
                        <span class="count" id="preparingCount">0</span>
                    </div>
                    <div class="column-content" id="preparingOrders">
                        <!-- Haz─▒rlanan sipari┼ş kartlar─▒ buraya -->
                    </div>
                </div>

                <!-- Teslim Edilen Sipari┼şler -->
                <div class="order-column">
                    <div class="column-header success">
                        <h3><i class="fa-solid fa-check-double"></i> Tamamlananlar</h3>
                        <span class="count" id="completedCount">0</span>
                    </div>
                    <div class="column-content" id="completedOrders">
                        <!-- Tamamlanan sipari┼ş kartlar─▒ buraya -->
                    </div>
                </div>
            </div>

            <!-- Masa Kontrol├╝ G├Âr├╝n├╝m├╝ -->
            <div class="tables-board hidden" id="view-tables">
                <div class="tables-grid" id="tablesContainer">
                    <!-- Masa kartlar─▒ JS ile buraya gelecek -->
                </div>
            </div>

            <!-- Sipari┼ş Ge├ğmi┼şi G├Âr├╝n├╝m├╝ -->
            <div class="history-board hidden" id="view-history">
                <div class="history-container">
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>Tarih & Saat</th>
                                <th>Masa</th>
                                <th>Sipari┼ş Detay─▒</th>
                                <th>Notlar</th>
                                <th>Tutar</th>
                                <th>Durum</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody">
                            <!-- Ge├ğmi┼ş sipari┼şler JS ile buraya gelecek -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- ├ûzel Onay Modal─▒ -->
    <div id="confirmModal" class="modal hidden" style="z-index: 2000;">
        <div class="modal-content" style="max-width: 350px; border-radius: var(--radius-lg); transform: scale(0.9); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.1);">
            <div class="modal-body" style="text-align: center; padding: 2.5rem 1.5rem 2rem;">
                <div style="font-size: 3.5rem; margin-bottom: 1rem; color: #f44336;"><i class="fa-solid fa-triangle-exclamation"></i></div>
                <h3 style="margin-bottom: 0.8rem; font-size: 1.4rem; font-weight: 700;">Emin misiniz?</h3>
                <p id="confirmModalMessage" style="color: var(--text-muted); margin-bottom: 1.8rem; font-size: 1rem; line-height: 1.5;">Bu i┼şlemi yapmak istedi─şinize emin misiniz?</p>
                <div style="display: flex; gap: 10px; justify-content: center;">
                    <button id="confirmBtnCancel" class="btn btn-secondary" style="padding: 0.8rem 1.5rem;">─░ptal</button>
                    <button id="confirmBtnYes" class="btn btn-danger" style="padding: 0.8rem 1.5rem;">Evet, Sil</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Supabase CDN (cPanel i├ğin zorunlu) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Scripts -->
    <script type="module" src="./js/admin.js"></script>
</body>
</html>
